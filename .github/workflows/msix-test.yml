name: MSIX test package

# Produces a SIGNED-BUT-SELF-SIGNED .msix for local testing only — NOT for
# Store upload. It installs the release's NSIS setup silently on a GitHub
# Windows runner, wraps the installed app with scripts/make-msix.ps1
# (-NoWebView2Dependency, so a sideloaded install doesn't demand the WebView2
# framework package; Windows 11's evergreen runtime serves the app itself),
# signs it with a throwaway self-signed certificate, and uploads the .msix +
# the .cer to import before installing.
#
# The tile logos inside are the script's generated placeholders — replace
# them with real brand tiles before any real (Partner Center) submission.

on:
  workflow_dispatch:
    inputs:
      setup_asset:
        description: "Release asset URL of the NSIS setup (x64-setup.exe)"
        default: "https://github.com/jsaenz03/camorg/releases/download/v0.7.3/Camog_0.7.3_x64-setup.exe"
      msix_version:
        description: "MSIX version (x.y.z.0)"
        default: "0.7.3.0"

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - name: Checkout (for scripts/make-msix.ps1)
        uses: actions/checkout@v4

      - name: Download the NSIS setup
        shell: pwsh
        run: Invoke-WebRequest -Uri "${{ github.event.inputs.setup_asset }}" -OutFile setup.exe

      - name: Install the app silently, then find it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ("setup.exe size: " + (Get-Item .\setup.exe).Length)

          # The unsigned app files get quarantined by Defender the moment the
          # installer drops them (install "succeeds", registry is written,
          # files vanish). Runner is ephemeral — disable realtime scanning
          # for the packaging step.
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath (Join-Path $env:LOCALAPPDATA 'Camog') -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess 'setup.exe' -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 5

          # 1) The NSIS uninstall key records wherever the installer put the
          # app (InstallLocation is written wrapped in literal quotes).
          $keys = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*Camog*' } |
            Select-Object -First 1
          if ($entry -and $entry.InstallLocation) {
            $loc = $entry.InstallLocation.Trim('"')
            Write-Host "Registry: $($entry.DisplayName) @ $loc (Camog.exe present: $(Test-Path (Join-Path $loc 'Camog.exe')))"
            if (Test-Path (Join-Path $loc 'Camog.exe')) { $appDir = $loc }
          }

          # 2) Known template locations.
          if (-not $appDir) {
            foreach ($d in @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Camog'),
              (Join-Path $env:LOCALAPPDATA 'Camog'),
              (Join-Path $env:ProgramFiles 'Camog')
            )) {
              if (Test-Path (Join-Path $d 'Camog.exe')) { $appDir = $d; break }
            }
          }

          # 3) Fallback: bypass the installer entirely — extract the NSIS
          # payload with 7-Zip (preinstalled on the runner images).
          if (-not $appDir) {
            Write-Host "Silent install produced no files - extracting the setup payload instead"
            $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
            if (-not (Test-Path $sevenZip)) { throw "7-Zip not found at $sevenZip" }
            New-Item -ItemType Directory -Force -Path C:\CamogStaged | Out-Null
            $sevenOut = & $sevenZip x .\setup.exe -oC:\CamogStaged -y
            Write-Host "7z exit code: $LASTEXITCODE"
            $sevenOut | Select-Object -Last 12 | ForEach-Object { Write-Host "7z: $_" }
            $exe = Get-ChildItem C:\CamogStaged -Filter Camog.exe -Recurse | Select-Object -First 1
            if (-not $exe) { throw "Camog.exe not produced by install or by extraction" }
            $appDir = $exe.DirectoryName
          }

          Write-Host "App dir: $appDir"
          "APPDIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Defender verdicts (diagnostics)
        if: failure()
        shell: powershell
        run: |
          try { Get-MpThreat | Select-Object -First 10 | Format-List ThreatName, Resources | Out-String | Write-Host } catch { Write-Host "Get-MpThreat: $_" }
          try { Get-MpThreatDetection | Select-Object -First 10 | Format-List ThreatID, Resources | Out-String | Write-Host } catch { Write-Host "Get-MpThreatDetection: $_" }

      - name: Pack the MSIX
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\make-msix.ps1 `
            -AppDir "$env:APPDIR" `
            -Version "${{ github.event.inputs.msix_version }}" `
            -IdentityName "CamogDesktopTest" `
            -Publisher "CN=Camog Test" `
            -OutDir .\msix `
            -NoWebView2Dependency

      - name: Self-sign for sideloading
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Camog Test" `
            -KeyUsage DigitalSignature -FriendlyName "Camog test MSIX" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfxPassword = ConvertTo-SecureString -String "camog-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath .\camog-test.pfx -Password $pfxPassword
          Export-Certificate -Cert $cert -FilePath .\camog-test.cer
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $msix = Get-ChildItem .\msix\*.msix | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /f .\camog-test.pfx /p "camog-test" "$msix"

      - name: Install instructions for the tester
        shell: pwsh
        run: |
          @'
          Camog TEST MSIX — sideload install (not for the Store)
          =======================================================
          1. Import the test certificate (one-time per machine):
             double-click camog-test.cer > Install Certificate >
             Local Machine > Place all certificates in the following store >
             Browse... > Trusted People > Finish.
             (Or from an admin PowerShell:
              certutil -addstore -f TrustedPeople camog-test.cer)
          2. Double-click the .msix and click Install. Windows 11 allows
             sideloading by default; on Windows 10 enable Sideload apps in
             Settings > Update & Security > For developers first.
          3. Launch Camog from the Start menu.

          Things worth checking (the reason this package exists):
          - App launches and renders (WebView2 under package identity).
          - Sign-in works; licence activation succeeds and Settings shows
            the version 0.7.3.
          - Licence device identity: does C:\ProgramData still hold the
            machine identity where the licence system expects it?
          - Phone link opens; expect the generic Windows firewall prompt
            the first time it listens (the NSIS firewall rule does not
            exist in an MSIX install).
          - Capture a photo, open photo detail, generate a report.
          - Uninstall from the Start menu removes it cleanly.
          '@ | Out-File -FilePath .\INSTALL-test-msix.txt -Encoding utf8

      - name: Upload the test package
        uses: actions/upload-artifact@v4
        with:
          name: camog-test-msix
          path: |
            msix/*.msix
            camog-test.cer
            INSTALL-test-msix.txt
          if-no-files-found: error
