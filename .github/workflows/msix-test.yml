name: MSIX package (test or store)

# Produces an .msix from the release's NSIS setup, on a GitHub Windows
# runner — no Windows machine needed.
#
# Two modes:
#   - TEST (default; no identity inputs): sideload package with a test
#     identity, self-signed with a throwaway certificate, WebView2 package
#     dependency omitted (a sideload can't resolve it; the app's own loader
#     uses the evergreen runtime). For trying the packaging on a machine —
#     never for Partner Center upload.
#   - STORE (set identity_name + publisher): the upload package, carrying
#     the real Partner Center identity and the WebView2 package dependency
#     (the Store resolves it and re-signs the package — no local signing).
#
# Identity values come from Partner Center: App management → App identity
# ("Package/Identity" → Name and Publisher). See MSSTORE_GUIDE.md step 2.
# Tile logos are the real brand tiles from src-tauri/assets/msix.

on:
  workflow_dispatch:
    inputs:
      setup_asset:
        description: "Release asset URL of the NSIS setup (x64-setup.exe)"
        default: "https://github.com/jsaenz03/camorg/releases/download/v0.7.3/Camog_0.7.3_x64-setup.exe"
      msix_version:
        description: "MSIX version (x.y.z.0)"
        default: "0.7.3.0"
      identity_name:
        description: "Partner Center Package/Identity Name (leave empty for a test package)"
        default: ""
      publisher:
        description: "Partner Center Package/Identity Publisher, CN=... (with identity_name above)"
        default: ""

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - name: Checkout (for scripts/make-msix.ps1 and the brand tiles)
        uses: actions/checkout@v4

      - name: Download the NSIS setup
        shell: pwsh
        run: Invoke-WebRequest -Uri "${{ github.event.inputs.setup_asset }}" -OutFile setup.exe

      - name: Install the app silently, then find it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ("setup.exe size: " + (Get-Item .\setup.exe).Length)

          # The unsigned app files get quarantined by Defender the moment the
          # installer drops them (install "succeeds", registry is written,
          # files vanish). Runner is ephemeral — disable realtime scanning
          # for the packaging step.
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath (Join-Path $env:LOCALAPPDATA 'Camog') -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess 'setup.exe' -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 5

          # 1) The NSIS uninstall key records wherever the installer put the
          # app (InstallLocation is written wrapped in literal quotes).
          $keys = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*Camog*' } |
            Select-Object -First 1
          if ($entry -and $entry.InstallLocation) {
            $loc = $entry.InstallLocation.Trim('"')
            Write-Host "Registry: $($entry.DisplayName) @ $loc (Camog.exe present: $(Test-Path (Join-Path $loc 'Camog.exe')))"
            if (Test-Path (Join-Path $loc 'Camog.exe')) { $appDir = $loc }
          }

          # 2) Known template locations.
          if (-not $appDir) {
            foreach ($d in @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Camog'),
              (Join-Path $env:LOCALAPPDATA 'Camog'),
              (Join-Path $env:ProgramFiles 'Camog')
            )) {
              if (Test-Path (Join-Path $d 'Camog.exe')) { $appDir = $d; break }
            }
          }

          # 3) Fallback: bypass the installer entirely — extract the NSIS
          # payload with 7-Zip (preinstalled on the runner images). The
          # payload stores the app binary under a build-time name; the
          # largest .exe is the Tauri binary, renamed to Camog.exe below.
          if (-not $appDir) {
            Write-Host "Silent install produced no usable files - extracting the setup payload instead"
            $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
            if (-not (Test-Path $sevenZip)) { throw "7-Zip not found at $sevenZip" }
            New-Item -ItemType Directory -Force -Path C:\CamogStaged | Out-Null
            $sevenOut = & $sevenZip x .\setup.exe -oC:\CamogStaged -y
            Write-Host "7z exit code: $LASTEXITCODE"
            $sevenOut | Select-Object -Last 8 | ForEach-Object { Write-Host "7z: $_" }
            Write-Host "Extracted payload:"
            Get-ChildItem C:\CamogStaged -Recurse -File |
              ForEach-Object { Write-Host ("  " + $_.FullName.Substring(15) + "  " + $_.Length) }
            $mainExe = Get-ChildItem C:\CamogStaged -Filter *.exe -Recurse |
              Sort-Object Length -Descending | Select-Object -First 1
            if (-not $mainExe) { throw "No .exe found in the NSIS payload" }
            Write-Host "Main binary: $($mainExe.FullName) ($($mainExe.Length) bytes)"
            if ($mainExe.Name -ne 'Camog.exe') { Rename-Item $mainExe.FullName 'Camog.exe' }
            $appDir = $mainExe.DirectoryName
          }

          # Wherever the app dir came from, the manifest needs Camog.exe.
          if (-not (Test-Path (Join-Path $appDir 'Camog.exe'))) {
            $mainExe = Get-ChildItem $appDir -Filter *.exe |
              Sort-Object Length -Descending | Select-Object -First 1
            if (-not $mainExe) { throw "No .exe in $appDir" }
            Rename-Item $mainExe.FullName 'Camog.exe'
          }

          # Strip NSIS installer machinery — the extracted payload carries
          # $PLUGINSDIR, $TEMP and uninstall.exe alongside the single
          # self-contained app binary, and none of it belongs in a package.
          Get-ChildItem $appDir -Force |
            Where-Object { $_.Name -in '$PLUGINSDIR', '$TEMP', 'uninstall.exe' } |
            Remove-Item -Recurse -Force
          Write-Host "Payload after cleanup:"
          Get-ChildItem $appDir -Recurse -File | ForEach-Object { Write-Host ("  " + $_.Name + "  " + $_.Length) }

          "APPDIR=$appDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Pack the MSIX
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ github.event.inputs.identity_name }}
          PUBLISHER: ${{ github.event.inputs.publisher }}
        run: |
          $testMode = -not $env:IDENTITY_NAME
          # DisplayName must match the product's reserved name for Store
          # upload; the WebView2 package dependency is always omitted —
          # Partner Center cannot resolve Microsoft's framework package, so
          # the app relies on the Evergreen runtime (preinstalled on
          # Windows 11, near-universal on updated Windows 10).
          $packArgs = @(
            '-AppDir', "$env:APPDIR",
            '-Version', '${{ github.event.inputs.msix_version }}',
            '-IdentityName', $(if ($testMode) { 'CamogDesktopTest' } else { $env:IDENTITY_NAME }),
            '-Publisher', $(if ($testMode) { 'CN=Camog Test' } else { $env:PUBLISHER }),
            '-PublisherDisplayName', $(if ($testMode) { 'ClinicIQ Solutions' } else { 'cliniciq' }),
            '-DisplayName', $(if ($testMode) { 'Camog' } else { 'Camog-AU' }),
            '-OutDir', '.\msix',
            '-AssetsDir', 'src-tauri\assets\msix',
            '-NoWebView2Dependency'
          )
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\make-msix.ps1 @packArgs

      - name: Print generated manifest (on failure)
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path .\msix\staging\AppxManifest.xml) {
            Get-Content .\msix\staging\AppxManifest.xml | ForEach-Object { Write-Host "MANIFEST: $_" }
          } else {
            Write-Host "no staging manifest found"
            Get-ChildItem .\msix -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty FullName
          }

      - name: Self-sign for sideloading (test mode only)
        if: github.event.inputs.identity_name == ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Camog Test" `
            -KeyUsage DigitalSignature -FriendlyName "Camog test MSIX" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfxPassword = ConvertTo-SecureString -String "camog-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath .\camog-test.pfx -Password $pfxPassword
          Export-Certificate -Cert $cert -FilePath .\camog-test.cer
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $msix = Get-ChildItem .\msix\*.msix | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /f .\camog-test.pfx /p "camog-test" "$msix"

      - name: Install instructions for the tester (test mode only)
        if: github.event.inputs.identity_name == ''
        shell: pwsh
        run: |
          @'
          Camog TEST MSIX — sideload install (not for the Store)
          =======================================================
          1. Import the test certificate (one-time per machine):
             double-click camog-test.cer > Install Certificate >
             Local Machine > Place all certificates in the following store >
             Browse... > Trusted People > Finish.
             (Or from an admin PowerShell:
              certutil -addstore -f TrustedPeople camog-test.cer)
          2. Double-click the .msix and click Install. Windows 11 allows
             sideloading by default; on Windows 10 enable Sideload apps in
             Settings > Update & Security > For developers first.
          3. Launch Camog from the Start menu.

          Things worth checking (the reason this package exists):
          - App launches and renders (WebView2 under package identity).
          - Sign-in works; licence activation succeeds and Settings shows
            the version 0.7.3.
          - Licence device identity: does C:\ProgramData still hold the
            machine identity where the licence system expects it?
          - Phone link opens; expect the generic Windows firewall prompt
            the first time it listens (the NSIS firewall rule does not
            exist in an MSIX install).
          - Capture a photo, open photo detail, generate a report.
          - Uninstall from the Start menu removes it cleanly.
          '@ | Out-File -FilePath .\INSTALL-test-msix.txt -Encoding utf8

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.identity_name == '' && 'camog-test-msix' || 'camog-store-msix' }}
          path: |
            msix/*.msix
            camog-test.cer
            INSTALL-test-msix.txt
          if-no-files-found: error
