name: Build Desktop Installers

# Produces all four installers from CI — macOS DMG (Apple silicon + Intel)
# and Windows x64 (.msi + NSIS .exe) — since Tauri cannot cross-compile
# Windows binaries from macOS.
#
# Triggers:
#   - push to default branch / PR to default branch -> checks + build (artifacts downloadable)
#   - published GitHub Release   -> checks + build + attach installers to the release
#   - manual dispatch            -> checks + build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# tauri-action uploads installers to the release via the API — the default
# token is read-only, which fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # Quality gate: everything here must pass before any installer is built.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Self-checks (policy mirrors + feature wiring)
        run: bash scripts/run-self-checks.sh

      - name: Frontend build (static export)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (Playwright)
        run: npm test

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        # Pinned to a commit SHA: this action runs with a write-capable token.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # On a published release, attach the bundles to that release
          # (empty on push/PR/dispatch, where tauri-action ignores it).
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}

      - name: Upload installers (build artifact)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: camog-${{ matrix.platform }}-${{ matrix.args || 'default' }}
          path: |
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
