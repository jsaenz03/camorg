name: Build Desktop Installers

# Produces the installers from CI — macOS universal DMG (Apple Silicon +
# Intel) and Windows x64 (.msi + NSIS .exe) — since Tauri cannot cross-
# compile Windows binaries from macOS. (No MSIX: Tauri v2's CLI only bundles
# msi/nsis on Windows; Store packaging happens outside tauri build.)
# macOS legs sign + notarise only when the APPLE_CERTIFICATE / APPLE_API_*
# secrets exist; without them the DMGs are ad-hoc as before.
#
# Triggers:
#   - push to default branch -> checks + build (artifacts) + rolling 'edge' pre-release
#   - PR to default branch   -> checks + build (artifacts)
#   - published GitHub Release -> checks + build + attach installers to the release
#   - manual dispatch        -> checks + build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# tauri-action uploads installers to the release via the API — the default
# token is read-only, which fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # Quality gate: everything here must pass before any installer is built.
  checks:
    # v0.4.6 was pulled for its keychain permission prompt; its tag is kept
    # only as a stub release pointing at the latest version — never rebuild it.
    if: github.ref != 'refs/tags/v0.4.6'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Self-checks (policy mirrors + feature wiring)
        run: bash scripts/run-self-checks.sh

      - name: Frontend build (static export)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (Playwright)
        run: npm test

      - name: Phone companion page check (Playwright)
        run: node scripts/check-phone-page.mjs

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # One universal leg (both arch slices lipo'd together) — the DMG it
            # produces is the exact artifact attached to stable releases and
            # copied to the distribution page (AGENTS.md, releases convention).
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage Apple notary key (macOS)
        # APPLE_API_KEY (below) is the App Store Connect Key ID; the .p8 file
        # it authenticates with is written here from the APPLE_API_KEY_P8
        # secret, and its path is passed to tauri via APPLE_API_KEY_PATH.
        if: matrix.platform == 'macos-latest'
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/camog-notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/camog-notary.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Build Tauri app
        # Pinned to a commit SHA: this action runs with a write-capable token.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signed update channel (specs/006): only the Windows leg gets the
          # signing key — it produces the signed NSIS artifact and, on stable
          # releases, uploads latest.json to the release. Edge pushes have no
          # release to upload to, so the rolling edge never serves a manifest
          # and stable users can never auto-take a pre-release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.platform == 'windows-latest' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.platform == 'windows-latest' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # macOS signing + notarisation: tauri-action imports the base64 .p12
          # into an ephemeral keychain, then notarises and staples .app and
          # .dmg with the App Store Connect API key. Every var here is empty
          # until the APPLE_CERTIFICATE / APPLE_API_* secrets exist — empty
          # means tauri skips signing entirely (ad-hoc DMGs, as before), so
          # adding the secrets is what turns signing on, no code change.
          APPLE_SIGNING_IDENTITY: "${{ matrix.platform == 'macos-latest' && 'Developer ID Application: JOHN RAPHAEL SAENZ (26LPTJU2YH)' || '' }}"
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          # Throwaway password for tauri-action's ephemeral CI keychain.
          KEYCHAIN_PASSWORD: ${{ matrix.platform == 'macos-latest' && 'camog-ci-temp-keychain' || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
        with:
          args: ${{ matrix.args }}
          includeUpdaterJson: ${{ matrix.platform == 'windows-latest' }}
          # Serve the NSIS installer from the channel; WiX MSI installs keep
          # manual updates.
          updaterJsonPreferNsis: true
          # On a published release, attach the bundles to that release
          # (empty on push/PR/dispatch, where tauri-action ignores it).
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}

      - name: Notarise and staple the DMG (macOS)
        # Tauri's bundler notarises the .app but not the DMG it packs. This
        # closes the gap so the artifact carries its own ticket, matching the
        # DMGs notarised locally since 0.15.3. The p8 staged earlier persists
        # in RUNNER_TEMP for the whole job.
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_ID" ]; then
            echo "No App Store Connect key — skipping DMG notarisation (secrets not set)."
            exit 0
          fi
          DMG=$(find src-tauri/target/*/release/bundle/dmg -name '*.dmg' | head -1)
          echo "Notarising $DMG"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/camog-notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
        env:
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}

      - name: Upload installers (build artifact)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: camog-${{ matrix.platform }}-${{ matrix.args || 'default' }}
          path: |
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  publish-edge:
    # Releases convention: every packaged build of main lands on the Releases
    # page as a rolling 'edge' pre-release (recreated each run, never
    # accumulated). Stable releases are still cut by publishing a versioned
    # GitHub Release, which the release-event path above attaches to.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish rolling 'edge' pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — pin the repo so gh never needs git.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Move the 'edge' tag to this commit; recreate the release fresh.
          gh release delete edge --yes --cleanup-tag >/dev/null 2>&1 || true
          mapfile -t files < <(find installers -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \))
          echo "Attaching ${#files[@]} installers:" && printf '  %s\n' "${files[@]}"
          gh release create edge "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Edge build (main @ ${GITHUB_SHA:0:7})" \
            --prerelease \
            --notes "Automated build of \`main\` — [run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Untested pre-release; prefer the latest stable release for daily use."
          # The 0.15.3 run's recreate came out as a draft (URL turned into
          # /releases/untagged-…, invisible on the Releases page). Publishing
          # is idempotent for a release that's already public.
          gh release edit edge --draft=false >/dev/null
