name: Security Scan

# Dependency vulnerability scanning — part of the supplier's assurance
# story: weekly sweep plus every PR to main.
#
# npm audit gates on high/critical in PRODUCTION dependencies only; dev-
# dependency advisories are reported without failing the job (they do not
# ship inside the installers), so one transitive dev issue can't silence
# the whole scan. cargo-audit gates on any RustSec advisory.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 21 * * 0" # Sun 21:00 UTC = Mon 8am AEDT, ahead of the week's releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate at critical+ — both criticals from the 05/11/2026 first
      # scan were cleared same day (next 15.5.24 → 15.5.29, which the
      # @opennextjs/cloudflare peer range already required, plus the
      # non-breaking npm audit fix set; verified by a full static-export
      # build). The remaining highs are build-tool-only (postcss bundled
      # inside next — real fix is a Next 16 migration; glob/minimatch in
      # the OpenNext build chain — upstream) and none ship in the desktop
      # installers. Tighten this gate to high when those two chains ship
      # fixes; tracked in the supplier's private assurance records.
      - name: npm audit — dependencies gate at critical
        run: npm audit --omit=dev --audit-level=critical

      - name: npm audit — production dependencies, high+ (advisory)
        run: npm audit --omit=dev --audit-level=high || true

      - name: npm audit — dev dependencies (advisory only)
        run: npm audit --audit-level=high || true

      - name: cargo audit — RustSec advisories (gate)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
