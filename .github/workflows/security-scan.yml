name: Security Scan

# Dependency vulnerability scanning — part of the supplier's assurance
# story: weekly sweep plus every PR to main.
#
# npm audit gates on high/critical in PRODUCTION dependencies only; dev-
# dependency advisories are reported without failing the job (they do not
# ship inside the installers), so one transitive dev issue can't silence
# the whole scan. cargo-audit gates on any RustSec advisory.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 21 * * 0" # Sun 21:00 UTC = Mon 8am AEDT, ahead of the week's releases
  workflow_dispatch:

permissions:
  contents: read
  # rustsec/audit-check posts its findings as a check run and, when it
  # finds vulnerabilities, files a report issue — without issues: write
  # that POST fails with "Resource not accessible by integration" and
  # masks the actual advisory (the 16/11/2026 scheduled run #25 failure).
  checks: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate at critical+ — both criticals from the 05/11/2026 first
      # scan were cleared same day (next 15.5.24 → 15.5.29, which the
      # @opennextjs/cloudflare peer range already required, plus the
      # non-breaking npm audit fix set; verified by a full static-export
      # build). The remaining highs are build-tool-only (postcss bundled
      # inside next — real fix is a Next 16 migration; glob/minimatch in
      # the OpenNext build chain — upstream) and none ship in the desktop
      # installers. Tighten this gate to high when those two chains ship
      # fixes; tracked in the supplier's private assurance records.
      - name: npm audit — dependencies gate at critical
        run: npm audit --omit=dev --audit-level=critical

      - name: npm audit — production dependencies, high+ (advisory)
        run: npm audit --omit=dev --audit-level=high || true

      - name: npm audit — dev dependencies (advisory only)
        run: npm audit --audit-level=high || true

      - name: cargo audit — RustSec advisories (gate)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # RUSTSEC-2023-0071 (Marvin Attack — timing sidechannel in rsa
          # 0.9.10): unpatched upstream, and its only reachable path is
          # sqlx-mysql's auth handshake, which Camog never exercises (SQLite
          # only). Reasoned in src-tauri/audit.toml, which serves local
          # cargo-audit runs; the action does not read that file, so the
          # allowlist is passed here.
          # RUSTSEC-2026-0459 (CVE-2026-119375 — libsqlite3-sys 0.30.1
          # bundles a SQLite that can return uninitialised page-cache memory
          # for a crafted DB + mismatched-page-size WAL pair, reached via
          # tauri-plugin-sql → sqlx-sqlite): patched only in
          # libsqlite3-sys 0.39+, which no published sqlx accepts
          # (sqlx-sqlite 0.9.0 caps <0.38.0; tauri-plugin-sql 2.6.0 pins
          # sqlx ^0.8) — unfixable in-tree until sqlx bumps. Exploitation
          # needs local write access to the app's database path, which
          # already implies control of the DB itself. Same file has the
          # full reasoning; drop both ignores when sqlx accepts 0.39+.
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0459
