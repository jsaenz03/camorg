[package]
name = "app"
version = "0.4.8"
description = "Camog — Clinical Photo Documentation"
authors = ["Camog"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tiny_http = "0.12"
socket2 = "0.6"
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
# 0.4.6 kept the photo key in the OS credential store; this reads that entry
# once for the key-file migration, and can be dropped once 0.4.6 is gone.
keyring = "2"
krilla = "0.8"
skrifa = "0.42"

[dev-dependencies]
flate2 = "1"
# The phone-link HTTP integration test drives handle_request through Tauri's
# mock runtime (no window, real sockets); same crate as the main dependency,
# test feature enabled for tests only.
tauri = { version = "2.11.3", features = ["test"] }
